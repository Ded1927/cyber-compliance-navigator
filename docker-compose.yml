services:
  db:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-cyberlaw-navigator}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberlaw}
      POSTGRES_USER: ${POSTGRES_USER:-cyberlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberlaw_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-cyberlaw-navigator}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cyberlaw:cyberlaw_password@db:5432/cyberlaw}
      APP_ENV: ${APP_ENV:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cyberlaw_session}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CISO_ORDER_TEMPLATE_PATH: ${CISO_ORDER_TEMPLATE_PATH:-/app/app/document_generation/templates/ciso_order_template.docx}
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-cyberlaw-navigator}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-cyberlaw-navigator}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  frontend_node_modules:
  postgres_data:
